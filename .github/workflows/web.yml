name: web
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        working-directory: apps/web
        run: npm ci
      - name: Install test-only emulator tooling
        working-directory: tests/emulators
        run: npm ci
      - name: Typecheck and unit tests
        working-directory: apps/web
        run: npx tsc --noEmit && npx vitest run
      - name: Production build is refused with development identities
        working-directory: apps/web
        run: |
          if VITE_AUTH_MODE=dev VITE_GATEWAY_URL=http://127.0.0.1:5199 npx vite build; then echo "guard failed"; exit 1; fi
          VITE_AUTH_MODE=firebase VITE_GATEWAY_URL=https://relay.example.invalid VITE_FIREBASE_API_KEY=public-web-key VITE_FIREBASE_AUTH_DOMAIN=example.firebaseapp.com VITE_FIREBASE_PROJECT_ID=example-project VITE_FIREBASE_APP_ID=1:1:web:1 npx vite build
          if VITE_AUTH_MODE=firebase VITE_GATEWAY_URL=https://relay.example.invalid VITE_FIREBASE_API_KEY=k VITE_FIREBASE_AUTH_DOMAIN=d VITE_FIREBASE_PROJECT_ID=demo-x VITE_FIREBASE_APP_ID=a VITE_FIREBASE_AUTH_EMULATOR_URL=http://127.0.0.1:9099 npx vite build; then echo "emulator guard failed"; exit 1; fi
          if grep -R "dev/sign-in" dist/assets >/dev/null; then echo "note: dev sign-in client code is present but disabled by VITE_AUTH_MODE"; fi
      - run: dotnet build OrbitDrive.slnx -c Release
      - name: Install browsers
        working-directory: apps/web
        # The Ubuntu mirror sometimes stalls for minutes on a single package (seen several times; on slow days the download alone can take 10+ minutes, so an attempt gets 18 minutes). apt gets its
        # own stall timeout and retries, and each ATTEMPT is also bounded: a stuck attempt is asked to stop with SIGINT (so apt releases the dpkg lock),
        # leftovers are cleaned up, and the next attempt starts. The step is still bounded and still fails if the browsers cannot be installed.
        timeout-minutes: 40
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/99ci-network >/dev/null
          for attempt in 1 2; do
            if timeout --signal=INT --kill-after=60 1080 npx playwright install --with-deps chromium firefox webkit; then exit 0; fi
            echo "browser install attempt $attempt failed or stalled"
            sudo pkill -INT -x apt-get || true; sudo pkill -INT -x dpkg || true; sleep 10
            sudo dpkg --configure -a || true
          done
          exit 1
      - name: Browser tests against the real gateway and agent
        working-directory: apps/web
        env:
          ORBIT_E2E_LARGE_MIB: '1024'   # the save-to-file size test streams a real 1 GiB file (desktop Chromium)
        run: npx playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: web-evidence
          path: |
            artifacts/web-screenshots/
            apps/web/playwright-report/
          retention-days: 14
