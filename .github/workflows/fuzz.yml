name: fuzz
# Coverage-guided fuzzing (AFL++ driving SharpFuzz-instrumented OrbitDrive.Core) of the PC-side parsers that read outside bytes or text:
# file-type sniffing, the image-size probe, path-segment rules, version labels and the console's line reader. Manual only: it holds no
# secrets, creates nothing in the cloud and touches nothing outside the runner. A crash, hang or broken invariant fails the job and is
# uploaded; replay it with `dotnet tests/fuzz/OrbitDrive.Fuzz/bin/Release/net10.0/OrbitDrive.Fuzz.dll <target> < crashfile`.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds of fuzzing per target (five targets run one after another)
        default: '120'
permissions:
  contents: read
jobs:
  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Install AFL++ and the SharpFuzz instrumenter
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q afl++
          dotnet tool install --global SharpFuzz.CommandLine
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
          afl-fuzz -h 2>&1 | head -1 || true
      - name: Build, then a seeded smoke run on the plain build (an instrumented build only runs under afl-fuzz)
        run: |
          dotnet build tests/fuzz/OrbitDrive.Fuzz -c Release
          dotnet tests/fuzz/OrbitDrive.Fuzz/bin/Release/net10.0/OrbitDrive.Fuzz.dll smoke 5000
      - name: Instrument OrbitDrive.Core for AFL
        run: sharpfuzz tests/fuzz/OrbitDrive.Fuzz/bin/Release/net10.0/OrbitDrive.Core.dll
      - name: Fuzz each target
        env:
          AFL_SKIP_BIN_CHECK: '1'
          AFL_NO_AFFINITY: '1'
          AFL_SKIP_CPUFREQ: '1'
          AFL_I_DONT_CARE_ABOUT_MISSING_CRASHES: '1'
          AFL_NO_UI: '1'
        run: |
          set -u
          failed=0
          for t in sniff probe segment label line; do
            echo "::group::$t"
            mkdir -p "out/$t"
            afl-fuzz -i "tests/fuzz/corpus/$t" -o "out/$t" -t 10000 -m none -V "${{ inputs.seconds }}" -- \
              dotnet tests/fuzz/OrbitDrive.Fuzz/bin/Release/net10.0/OrbitDrive.Fuzz.dll "$t" --afl || echo "afl-fuzz exited with $?"
            cat "out/$t/default/fuzzer_stats" 2>/dev/null | grep -E "execs_done|execs_per_sec|corpus_count|saved_crashes|saved_hangs|edges_found" || true
            n=$(find "out/$t/default/crashes" "out/$t/default/hangs" -type f ! -name README.txt 2>/dev/null | wc -l)
            echo "$t: $n crash/hang files"
            [ "$n" -eq 0 ] || failed=1
            echo "::endgroup::"
          done
          exit $failed
      - name: Keep findings and the final corpus
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-findings
          path: out
          if-no-files-found: ignore
