name: desktop-ui
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  owner-console:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet build apps/desktop/OrbitDrive.Desktop -c Release
      - run: dotnet build services/gateway/OrbitDrive.Gateway -c Release
      - run: dotnet build apps/desktop/OrbitDrive.ThumbnailHelper -c Release   # the real preview helper, so the console's previews switch is exercised for real
      - name: Drive the real WPF console through UI Automation (real agent + gateway)
        shell: powershell
        run: |
          $env:ORBITDRIVE_THUMBNAIL_HELPER = (Get-ChildItem apps/desktop/OrbitDrive.ThumbnailHelper/bin/Release -Recurse -Filter OrbitDrive.ThumbnailHelper.exe | Select-Object -First 1).FullName
          if (-not $env:ORBITDRIVE_THUMBNAIL_HELPER) { throw 'the preview helper was not built' }
          ./scripts/desktop-ui-test.ps1 -Exe "apps/desktop/OrbitDrive.Desktop/bin/Release/net10.0-windows/OrbitDrive.exe" -GatewayDll "services/gateway/OrbitDrive.Gateway/bin/Release/net10.0/OrbitDrive.Gateway.dll" -OutDir artifacts
      - name: Local control pipe is closed to a different Windows user (throwaway account, real agent)
        shell: powershell
        run: |
          dotnet build apps/desktop/OrbitDrive.Agent -c Release
          ./scripts/second-user-pipe-test.ps1 -AgentExe "apps/desktop/OrbitDrive.Agent/bin/Release/net10.0/orbitdrive-agent.exe"
      # The build sandbox used for review can read job logs but not artifact storage, so the screenshots are also
      # written to the log (base64, between markers) to make visual review of the real Windows UI possible.
      - name: Publish screenshots in the log for review
        if: always()
        shell: powershell
        run: |
          Get-ChildItem artifacts -Filter *.png -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "@@PNG-BEGIN $($_.Name)"
            $b = [Convert]::ToBase64String([IO.File]::ReadAllBytes($_.FullName))
            for ($i = 0; $i -lt $b.Length; $i += 4000) { Write-Host ("@@" + $b.Substring($i, [Math]::Min(4000, $b.Length - $i))) }
            Write-Host "@@PNG-END $($_.Name)"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: owner-console-ui
          path: artifacts/
          retention-days: 14
