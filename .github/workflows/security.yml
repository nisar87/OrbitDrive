name: security
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Secret scan of tracked files
        run: node scripts/secret-scan.mjs
      - name: Workflows pin actions to commit SHAs
        run: |
          if grep -RnE "uses: [^@]+@(v[0-9]|main|master)" .github/workflows; then echo "unpinned action"; exit 1; fi
      - name: No deployment or elevated permissions in ordinary workflows
        run: |
          # relay-release.yml may create a release with the short-lived workflow token; nothing else may write.
          if grep -RnE --exclude=security.yml --exclude=relay-release.yml --exclude=deploy-web.yml --exclude=desktop-release.yml "firebase deploy|id-token: write|contents: write" .github/workflows; then echo "unexpected privileged step"; exit 1; fi
      - name: The one deploy workflow stays keyless, hosting-only and main-only
        run: |
          f=.github/workflows/deploy-web.yml
          # may request an OIDC token (no stored key) but never write to the repository, never use a stored credential, and runs only for main
          if grep -nE "contents: write|actions: write|secrets\.|service_account_key|credentials_json|GOOGLE_APPLICATION_CREDENTIALS|--only (firestore|auth|functions|storage)|deploy --only [a-z,]*[^h ]" $f | grep -vE "^\s*[0-9]+:\s*#"; then echo "deploy workflow is not keyless/hosting-only"; exit 1; fi
          grep -q "branches: \[main\]" $f
          grep -q "id-token: write" $f
          grep -q "all seven verification" $f
      - name: The update-feed release workflow is main-only, has no cloud identity and uses its one secret only as a temporary file
        run: |
          f=.github/workflows/desktop-release.yml
          grep -q "branches: \[main\]" $f
          grep -q "all seven verification" $f
          grep -q "refs/heads/main" $f
          if grep -nE "id-token|firebase|google-github-actions|actions: write|pull_request|secrets\.[A-Z_]+" $f | grep -vE "^\s*[0-9]+:\s*#" | grep -vE "secrets\.(UPDATE_SIGNING_KEY|GITHUB_TOKEN)"; then echo "release workflow has an unexpected capability"; exit 1; fi
          test "$(grep -c 'secrets\.UPDATE_SIGNING_KEY' $f)" = 1
          grep -q "Remove-Item \$env:KEY_FILE" $f
          if grep -nE "echo.*UPDATE_SIGNING_KEY|Write-(Host|Output).*UPDATE_SIGNING_KEY|\$env:UPDATE_SIGNING_KEY[^.]" $f | grep -v "IsNullOrWhiteSpace" | grep -vE "WriteAllText"; then echo "signing secret may be printed"; exit 1; fi
      - name: Relay scripts never embed credentials or disable TLS checks
        run: |
          if grep -RnE "curl[^|]*(-k|--insecure)|StrictHostKeyChecking=no|PRIVATE KEY|password=" infra/relay; then echo "unsafe relay script"; exit 1; fi
      # Each audit below runs even if an earlier one failed, so one finding can never hide another.
      # Shipped dependencies: any high/critical advisory fails, no exceptions. Build/test tooling: fails unless the
      # advisory has a valid, owner-authorised, dated entry in security/audit-exceptions.json (max 30 days; see
      # scripts/audit-check.mjs and docs/security/accepted-risks.md). Accepted advisories are printed as warnings.
      - name: Web dependencies audit
        if: ${{ !cancelled() }}
        run: (cd apps/web && npm ci) && node scripts/audit-check.mjs apps/web
      - name: Environment definitions are valid; staging and production templates refuse deployment
        if: ${{ !cancelled() }}
        run: |
          node --test tests/web/environments.test.mjs
          for e in development staging production; do node scripts/validate-environment.mjs infra/environments/$e.json; done
          if node scripts/validate-environment.mjs infra/environments/production.json --deploy; then echo "production template must not be deployable"; exit 1; fi
      - name: Production web bundle contains only reviewed runtime packages
        if: ${{ !cancelled() }}
        run: node scripts/bundle-check.mjs
      - name: Assumptions behind accepted advisories still hold
        if: ${{ !cancelled() }}
        run: node --test tests/relay/picomatch-exposure.test.mjs
      - name: Web security headers (strict CSP builder, fail-closed placeholder in firebase.json)
        if: ${{ !cancelled() }}
        run: node --test tests/web/security-headers.test.mjs && node scripts/web-security-headers.mjs --check
      - name: Audit gate self-test
        if: ${{ !cancelled() }}
        run: node --test tests/relay/audit-check.test.mjs
      - name: Integration-test dependencies audit
        if: ${{ !cancelled() }}
        run: (cd tests/integration && npm ci) && node scripts/audit-check.mjs tests/integration
      - name: Emulator tooling audit (test-only, never shipped; report only)
        if: ${{ !cancelled() }}
        working-directory: tests/emulators
        run: npm ci && (npm audit --audit-level=high || echo "::warning::firebase-tools (test-only emulator tooling) has known advisories; it is not part of any shipped artifact")
      - name: NuGet vulnerability audit
        if: ${{ !cancelled() }}
        run: |
          dotnet restore OrbitDrive.slnx
          dotnet list OrbitDrive.slnx package --vulnerable --include-transitive | tee nuget-audit.txt
          if grep -qiE "\b(High|Critical)\b" nuget-audit.txt; then exit 1; fi
