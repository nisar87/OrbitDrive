name: deploy-web
# Continuous deployment of the DEVELOPMENT web app to Firebase Hosting (project orbitdrive-dev).
# Runs only for a commit on main, and only if all seven verification workflows succeeded for that exact commit (main itself is only ever
# advanced to such commits; this re-checks). Deploys HOSTING ONLY with scripts/deploy-web.mjs: no Firestore, Auth, rules or billing.
# Needs ONE repository secret, FIREBASE_SERVICE_ACCOUNT_ORBITDRIVE_DEV (a service-account key with the "Firebase Hosting Admin" role, created by
# `firebase init hosting:github`). Until it exists the job stops at the first step with an explanation; nothing is deployed.
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'infra/firebase/**', 'scripts/web-security-headers.mjs', 'scripts/deploy-web.mjs', '.github/workflows/deploy-web.yml']
  workflow_dispatch:
concurrency:
  group: deploy-web
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ORBITDRIVE_DEV }}
    steps:
      - name: The deploy credential exists
        run: |
          if [ -z "$SERVICE_ACCOUNT" ]; then
            echo "::error::Secret FIREBASE_SERVICE_ACCOUNT_ORBITDRIVE_DEV is not set, so nothing was deployed. Run 'npx firebase-tools init hosting:github' once (see infra/firebase/README.md)."
            exit 1
          fi
      - name: All seven verification workflows are green for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=0
          for name in contracts desktop desktop-ui gateway integration security web; do
            result=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq "[.workflow_runs[] | select(.name==\"$name\") | .conclusion] | if length == 0 then \"missing\" elif any(. == \"success\") then \"success\" else (.[0] // \"running\") end")
            echo "$name: $result"
            [ "$result" = "success" ] || missing=1
          done
          if [ "$missing" != 0 ]; then echo "::error::Not every verification workflow is green for ${GITHUB_SHA}; not deploying."; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Deploy hosting only
        run: |
          key="$RUNNER_TEMP/firebase-deploy-key.json"
          (umask 077; printf '%s' "$SERVICE_ACCOUNT" > "$key")
          GOOGLE_APPLICATION_CREDENTIALS="$key" node scripts/deploy-web.mjs
          rm -f "$key"
