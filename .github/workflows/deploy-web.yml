name: deploy-web
# Continuous deployment of the DEVELOPMENT web app to Firebase Hosting (project orbitdrive-dev).
# Runs only for a commit on main, and only if all seven verification workflows succeeded for that exact commit (main itself is only ever
# advanced to such commits; this re-checks). Deploys HOSTING ONLY with scripts/deploy-web.mjs: no Firestore, Auth, rules or billing.
# Keyless: GitHub's OIDC token is exchanged through Google Workload Identity Federation (pool github-actions, provider github, which only
# accepts repository nisar87/OrbitDrive on refs/heads/main) for short-lived credentials of the service account github-deploy-hosting
# (role Firebase Hosting Admin only). No key or secret is stored anywhere.
on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'apps/site/index.html', 'apps/site/styles.css', 'apps/site/site.js', 'apps/site/assets/**', 'infra/firebase/**', 'scripts/web-security-headers.mjs', 'scripts/deploy-web.mjs', '.github/workflows/deploy-web.yml']
  workflow_dispatch:
concurrency:
  group: deploy-web
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: All seven verification workflows are green for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          missing=0
          for name in contracts desktop desktop-ui gateway integration security web; do
            result=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq "[.workflow_runs[] | select(.name==\"$name\") | .conclusion] | if length == 0 then \"missing\" elif any(. == \"success\") then \"success\" else (.[0] // \"running\") end")
            echo "$name: $result"
            [ "$result" = "success" ] || missing=1
          done
          if [ "$missing" != 0 ]; then echo "::error::Not every verification workflow is green for ${GITHUB_SHA}; not deploying."; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Authenticate to Google (keyless)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/821727049510/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-deploy-hosting@orbitdrive-dev.iam.gserviceaccount.com
      - name: Deploy hosting only
        run: node scripts/deploy-web.mjs
