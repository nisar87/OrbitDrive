name: nightly-soak
# Long, bounded soak of the real relay and agent processes under disturbance. Manual only: it holds no secrets, creates no cloud resources and
# touches nothing outside the runner. It is NOT a real-device or Windows-service soak; see docs/evidence/phase-evidence.md for what it does not prove.
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: Length of the run in seconds (default 600; the memory-growth rule applies from 240)
        default: '600'
permissions:
  contents: read
jobs:
  soak:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: dotnet build services/gateway/OrbitDrive.Gateway -c Release
      - run: dotnet build apps/desktop/OrbitDrive.Agent -c Release
      - run: npm ci
        working-directory: tests/integration
      - name: Soak
        run: node tests/soak/soak.mjs
        env:
          ORBIT_SOAK_SECONDS: ${{ inputs.seconds }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak-report-${{ matrix.os }}
          path: artifacts/
          retention-days: 30
