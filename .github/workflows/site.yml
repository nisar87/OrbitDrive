name: site
# MyOrbitDrive marketing site (static, apps/site). Preview only: this workflow tests it and never deploys it.
on:
  push:
    branches: [main, 'feature/**']
    paths: ['apps/site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['apps/site/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install
        working-directory: apps/site
        run: npm ci
      - name: Install Chromium
        working-directory: apps/site
        run: npx playwright install --with-deps chromium
      - name: Tests (accessibility, no third-party requests, keyboard, reduced motion, claims guard)
        working-directory: apps/site
        run: npx playwright test
