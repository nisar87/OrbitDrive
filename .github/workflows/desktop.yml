name: desktop
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - name: Record runner and toolchain
        shell: pwsh
        run: |
          dotnet --info
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture | Format-List
          "ImageOS=$env:ImageOS ImageVersion=$env:ImageVersion"
      - name: Build agent, core and WPF console (warnings are errors)
        run: |
          dotnet build apps/desktop/OrbitDrive.Agent -c Release
          dotnet build apps/desktop/OrbitDrive.Desktop -c Release
      - name: Build the native Explorer command and exercise it through COM (this is NOT Explorer, and not the Windows 11 menu)
        shell: pwsh
        run: |
          pwsh apps/desktop/OrbitDrive.ShellExtension/build.ps1 -Out "$PWD/artifacts/shell"
          [xml]$manifest = Get-Content apps/desktop/OrbitDrive.ShellExtension/AppxManifest.xml
          "manifest parses: identity $($manifest.Package.Identity.Name)"
          & "$PWD/artifacts/shell/ShellExtensionTest.exe" "$PWD/artifacts/shell/OrbitDriveShell.dll"
          if ($LASTEXITCODE -ne 0) { throw "ShellExtensionTest failed with $LASTEXITCODE" }
      - name: 'Update apply script: run the real embedded script under Windows PowerShell 5.1 (success, bad hash, hostile zip, missing agent, still running)'
        shell: powershell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests/desktop/apply-update.test.ps1
      - name: Core filesystem policy tests on Windows
        run: dotnet test tests/desktop/OrbitDrive.Core.Tests -c Release --logger "console;verbosity=normal"
