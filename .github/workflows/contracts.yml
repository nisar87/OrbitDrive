name: contracts
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Generated models match the schema (drift check)
        run: node packages/protocol/generate.mjs --check
      - name: C# serialization contract tests
        run: dotnet test tests/contracts/OrbitDrive.Protocol.Tests -c Release --logger "console;verbosity=normal"
      - name: TypeScript contract tests (same fixtures)
        working-directory: apps/web
        run: npm ci && npx vitest run
