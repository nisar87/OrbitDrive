name: gateway
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet --info
      - name: Build (warnings are errors)
        run: dotnet build services/gateway/OrbitDrive.Gateway -c Release
      - name: Unit tests
        run: dotnet test tests/gateway/OrbitDrive.Gateway.Tests -c Release --logger "console;verbosity=normal"
      - name: Relay updater, rollback, monitor and backup scripts (real gateway builds)
        run: node --test tests/relay/updater.test.mjs
