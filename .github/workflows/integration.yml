name: integration
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agent-gateway:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: dotnet build OrbitDrive.slnx -c Release
      - run: npm ci
        working-directory: tests/integration
      - name: Real agent + gateway processes, 1 GiB hash-verified transfer
        run: node --test --test-reporter=spec tests/integration/slice.test.mjs tests/integration/ipc.test.mjs tests/integration/devices.test.mjs tests/integration/qr.test.mjs tests/integration/firebase-auth.test.mjs tests/integration/restart.test.mjs tests/integration/faults.test.mjs tests/integration/pairing-limits.test.mjs tests/integration/browse.test.mjs tests/integration/transfers.test.mjs tests/integration/invitations.test.mjs tests/integration/previews.test.mjs tests/integration/archives.test.mjs tests/integration/search.test.mjs tests/integration/multipc.test.mjs tests/integration/uploads.test.mjs
        env:
          ORBIT_LARGE_MIB: 1024
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: transfer-metrics-${{ matrix.os }}
          path: artifacts/
          retention-days: 14
