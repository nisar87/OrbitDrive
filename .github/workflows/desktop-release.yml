name: desktop-release
# Publishes the DEVELOPMENT desktop build as the update feed the app's "Update now" button reads (GitHub release `desktop-dev`, a pre-release).
# Runs only for a commit on main, and only if all seven verification workflows succeeded for that exact commit. The build is UNSIGNED (no Windows
# code-signing certificate yet; the manifest and the SmartScreen notice say so). Updates are authenticated by an ECDSA P-256 signature over the
# manifest made with the owner's update key (repository secret UPDATE_SIGNING_KEY, public half built into the app); the app also checks the zip's
# SHA-256 and size from that signed manifest. The secret only ever exists as a temporary file on the runner and is never printed.
on:
  push:
    branches: [main]
    paths: ['apps/desktop/**', 'tools/release/**', 'docs/release/**', 'infra/environments/**', 'Directory.*', '.github/workflows/desktop-release.yml']
  workflow_dispatch:
concurrency:
  group: desktop-release
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: desktop-dev
    steps:
      - name: All seven verification workflows are green for this exact commit
        shell: bash
        run: |
          missing=0
          for name in contracts desktop desktop-ui gateway integration security web; do
            result=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=100" --jq "[.workflow_runs[] | select(.name==\"$name\") | .conclusion] | if length == 0 then \"missing\" elif any(. == \"success\") then \"success\" else (.[0] // \"running\") end")
            echo "$name: $result"
            [ "$result" = "success" ] || missing=1
          done
          if [ "$missing" != 0 ]; then echo "::error::Not every verification workflow is green for ${GITHUB_SHA}; not publishing."; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Release and update tooling tests
        run: node --test tests/release/release-lib.test.mjs tests/release/update-feed.test.mjs
      - name: Check the update signing key before building anything
        shell: pwsh
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_SIGNING_KEY)) { throw 'Repository secret UPDATE_SIGNING_KEY is not set. Create it with: node tools/release/make-update-key.mjs (see docs/release/OWNER_HANDOFF.md). Nothing was published.' }
          $key = Join-Path $env:RUNNER_TEMP 'update-signing-key.pem'
          [IO.File]::WriteAllText($key, $env:UPDATE_SIGNING_KEY.Trim() + "`n")
          $id = node tools/release/check-signing-key.mjs --key $key
          if ($LASTEXITCODE -ne 0) { Remove-Item $key -Force; throw 'The signing secret does not match the public key built into the app. Nothing was published.' }
          "KEY_ID=$id" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "KEY_FILE=$key" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build (self-contained win-x64; agent, thumbnail helper, WPF console)
        shell: pwsh
        run: |
          $base = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $parts = $base.Split('.')
          $version = "$($parts[0]).$($parts[1]).$env:GITHUB_RUN_NUMBER"
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "building $version from $env:GITHUB_SHA"
          node tools/release/release-candidate.mjs --version $version --commit $env:GITHUB_SHA --run-id $env:GITHUB_RUN_ID --out "$PWD/artifacts/release"
          if ($LASTEXITCODE -ne 0) { throw "release build failed with $LASTEXITCODE" }
      - name: The built app reports this commit and carries the update button
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts/release -Filter 'OrbitDrive-*-win-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw 'zip missing' }
          $out = Join-Path $env:RUNNER_TEMP 'rel-extract'
          Expand-Archive $zip.FullName -DestinationPath $out
          $app = Join-Path $out 'OrbitDrive'
          foreach ($f in 'orbitdrive-agent.exe','OrbitDrive.exe','defaults.json') { if (-not (Test-Path (Join-Path $app $f))) { throw "missing in archive: $f" } }
          $label = & "$app\orbitdrive-agent.exe" version
          "agent says: $label"
          if ($label -notmatch [regex]::Escape($env:GITHUB_SHA.Substring(0,12))) { throw 'agent does not report this commit' }
          if ($label -notmatch [regex]::Escape($env:VERSION)) { throw 'agent does not report this version' }
      - name: Sign the update manifest
        shell: pwsh
        run: |
          $zip = Get-ChildItem artifacts/release -Filter 'OrbitDrive-*-win-x64.zip' | Select-Object -First 1
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG"
          $notes = "Development build $env:VERSION (commit $($env:GITHUB_SHA.Substring(0,12))). Unsigned for Windows: SmartScreen may warn on first install only."
          node tools/release/make-update-manifest.mjs --zip $zip.FullName --version $env:VERSION --url-base $url --notes $notes --out artifacts/release/manifest.json
          if ($LASTEXITCODE -ne 0) { throw 'manifest failed' }
          node tools/release/sign-update-manifest.mjs --manifest artifacts/release/manifest.json --key $env:KEY_FILE --key-id $env:KEY_ID --out artifacts/release/update.json
          if ($LASTEXITCODE -ne 0) { throw 'signing failed' }
          Remove-Item $env:KEY_FILE -Force
          Remove-Item artifacts/release/manifest.json -Force
      - name: Publish the release (zip first, feed last)
        shell: pwsh
        run: |
          $dir = "$PWD/artifacts/release"
          $zip = Get-ChildItem $dir -Filter 'OrbitDrive-*-win-x64.zip' | Select-Object -First 1
          gh release view $env:TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target $env:GITHUB_SHA --prerelease --title "OrbitDrive development build (unsigned)" --notes "Rolling development build. Install once from the zip; afterwards use Settings > Software updates > Update now. Not for production."
            if ($LASTEXITCODE -ne 0) { throw 'could not create the release' }
          }
          gh release upload $env:TAG $zip.FullName "$dir/SHA256SUMS" "$dir/THIRD_PARTY_NOTICES.md" "$dir/release-manifest.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'upload failed' }
          gh release upload $env:TAG "$dir/update.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'feed upload failed' }
          $assets = gh release view $env:TAG --json assets --jq '.assets[].name'
          foreach ($name in $assets) { if ($name -like 'OrbitDrive-*-win-x64.zip' -and $name -ne $zip.Name) { gh release delete-asset $env:TAG $name --yes } }
      - name: The published feed verifies exactly as the app will verify it
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if node tools/release/verify-feed.mjs --feed "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/update.json" --expect-version "${VERSION}"; then exit 0; fi
            echo "attempt $attempt failed; waiting for the release CDN"; sleep 20
          done
          echo "::error::The published feed does not verify."; exit 1
