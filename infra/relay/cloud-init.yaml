#cloud-config
# First boot of an OrbitDrive relay host: fetch and run the idempotent bootstrap from this repository.
# Use only where the instance has internet access at first boot (attach the public IP at creation). Contains no secrets.
# Replace the three values for the environment being created.
runcmd:
  - curl -fsSL -o /root/bootstrap.sh https://raw.githubusercontent.com/nisar87/OrbitDrive/main/infra/relay/bootstrap.sh
  - bash /root/bootstrap.sh --host REPLACE-WITH-HOSTNAME --firebase-project REPLACE-WITH-PROJECT --web-origin https://REPLACE-WITH-WEB-ORIGIN >> /var/log/orbitdrive-bootstrap.log 2>&1
